name: CI — Quality & Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance, Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository governance & documentation
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/VISION.md
          test -f docs/PRODUCT.md
          test -f docs/LEARNING.md
          test -f docs/DESIGN_SYSTEM.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DEVELOPMENT.md
          test -f docs/CONTRIBUTING.md
          test -f docs/SPRINT_1_BACKLOG.md
          test -f .github/labels.json
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/feature_request.yml
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/topic_proposal.yml
          test -f .github/ISSUE_TEMPLATE/config.yml
          echo "Sprint 0 governance and architecture artifacts verified."

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Verify TypeScript types (strict mode)
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm run test:run

      - name: Verify production build
        run: npm run build
